name: brandlift-development-project

services:
  app:
    build:
      context: .
      args:
        user: developer
        uid: ${DOCKER_UID:-1000}
    image: brandlift-development-app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_ENV: local
      APP_URL: http://localhost:${APP_PORT:-8080}
      DB_URL: ""
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-brandlift}
      DB_USERNAME: ${DB_USERNAME:-brandlift}
      DB_PASSWORD: ${DB_PASSWORD:-brandlift_local}
      SESSION_DRIVER: database
      SESSION_DOMAIN: "null"
      SESSION_SECURE_COOKIE: "false"
    volumes:
      - ./:/var/www
      - node_modules:/var/www/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      start_period: 10m
      retries: 12
    networks:
      - laravel

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-brandlift}
      MYSQL_USER: ${DB_USERNAME:-brandlift}
      MYSQL_PASSWORD: ${DB_PASSWORD:-brandlift_local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-brandlift_root_local}
    volumes:
      - ./docker-compose/mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www:ro
      - ./docker-compose/nginx/laravel.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - laravel

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8090}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel

volumes:
  node_modules:

networks:
  laravel:
    driver: bridge
